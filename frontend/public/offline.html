<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | RYMEC ReClaim-iT</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 420px;
      margin: 20px;
    }
    h1 { margin-top: 0; color: #818cf8; }
    p { color: #94a3b8; line-height: 1.6; }
    button {
      margin-top: 20px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>📡 You Are Currently Offline</h2>
    <p>RYMEC ReClaim-iT requires an active connection to search or report lost items. Please check your WiFi or mobile data and try again.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
