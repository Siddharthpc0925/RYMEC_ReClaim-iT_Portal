<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RYMEC ReClaim-iT | Campus Lost & Found Portal</title>
    
    <!-- Meta & Branding -->
    <meta name="description" content="Rao Bahadur Y. Mahabaleswarappa Engineering College (RYMEC) official Lost & Found Portal. Structured reporting, explainable AI matching, verified handover, and campus analytics." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/png" href="/images/vvs-logo.jpg" />
    <link rel="apple-touch-icon" href="/images/vvs-logo.jpg" />
    
    <!-- iOS Liquid Glass Fullscreen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RYMEC ReClaim-iT" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA (U17)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
